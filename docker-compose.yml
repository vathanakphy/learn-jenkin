name: learning-jenkins

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: learning-jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: Asia/Phnom_Penh

volumes:
  jenkins_home:
    name: learning_jenkins_home